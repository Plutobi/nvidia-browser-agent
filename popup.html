<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>NIM Browser Agent</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <div class="titles">
        <span class="title">NIM Browser Agent</span>
        <button id="modelLine" class="model" title="Change model">…</button>
      </div>
      <button id="settingsBtn" title="Settings">&#9881;</button>
    </header>

    <textarea id="task" placeholder="Describe the task, e.g. &quot;Search for wireless mice on this page and open the top result&quot;"></textarea>

    <div class="row">
      <button id="startBtn">Start</button>
      <button id="stopBtn" disabled>Stop</button>
    </div>

    <div id="statusLine" class="status"></div>
    <div id="chat"></div>

    <script src="popup.js" type="module"></script>
  </body>
</html>
